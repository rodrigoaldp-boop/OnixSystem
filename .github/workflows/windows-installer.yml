name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (ex: v1.0.0). Deixe vazio para nao criar release."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

# Necessario para criar Release com softprops/action-gh-release
permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build app and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_installer.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/OnixSystem/OnixSystem.exe")) {
            throw "PyInstaller output missing: dist/OnixSystem/OnixSystem.exe"
          }
          $n = (Get-ChildItem -Path "dist/OnixSystem" -Recurse -File | Measure-Object).Count
          if ($n -lt 5) { throw "dist/OnixSystem tem poucos arquivos ($n); build incompleto?" }
          if (-not (Test-Path "release/OnixSystem-Setup.exe")) {
            throw "Inno nao gerou release/OnixSystem-Setup.exe"
          }
          $bytes = (Get-Item "release/OnixSystem-Setup.exe").Length
          Write-Host "setup.exe size: $bytes bytes"
          if ($bytes -lt 4MB) {
            throw "OnixSystem-Setup.exe muito pequeno ($bytes b); instalador provavelmente sem payload."
          }

      - name: Create portable ZIP (extrair e rodar OnixSystem.exe; sem instalador)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          if (-not (Test-Path "dist/OnixSystem/OnixSystem.exe")) { throw "dist ausente antes do zip" }
          Compress-Archive -Path "dist\OnixSystem\*" -DestinationPath "release\OnixPortable.zip" -CompressionLevel Optimal -Force
          Get-Item "release\OnixPortable.zip" | Format-List Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          # Nome curto + prefixo: UI em PT as vezes traduz nomes longos
          name: 01-Setup-exe
          path: release/OnixSystem-Setup.exe
          if-no-files-found: error

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: 02-Pasta-dist-PyInstaller
          path: dist/OnixSystem/**
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: 03-ZIP-Portable-sem-Inno
          path: release/OnixPortable.zip
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = ""

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release/OnixSystem-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
