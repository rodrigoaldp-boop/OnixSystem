name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (ex: v1.0.0). Deixe vazio para nao criar release."
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

# Necessario para criar Release com softprops/action-gh-release
permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build app and installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows_installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnixSystem-Setup
          path: release/OnixSystem-Setup.exe
          if-no-files-found: error

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: OnixSystem-Dist
          path: dist/OnixSystem/**
          if-no-files-found: error

      - name: Resolve release tag
        id: release_tag
        shell: pwsh
        run: |
          $tag = ""

          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub release
        if: steps.release_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            release/OnixSystem-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
